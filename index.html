<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ferretería Universitaria - Control de Stock</title>
    <style>
        /* Un diseño ultra simple, estilo limpio */
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        h2 { color: #333; text-align: center; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 95%; padding: 8px; border: 1px solid #999; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        #mensaje { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h2>🛒 Sistema de Ventas - Ferretería</h2>
    
    <form id="formularioVenta">
        <div class="campo">
            <label for="producto">Producto de Iluminación / Ferretería:</label>
            <input type="text" id="producto" placeholder="Ej: Foco LED 12W, Martillo, Cable">
        </div>

        <div class="campo">
            <label for="cantidad">Cantidad a vender:</label>
            <input type="number" id="cantidad" placeholder="Ej: 5">
        </div>

        <button type="submit">Registrar Venta</button>
    </form>

    <!-- Aquí JavaScript pintará las alertas de error o éxito -->
    <p id="mensaje"></p>

    <!-- Conectamos este HTML con tu archivo de JavaScript -->
    <script src="script.js"></script>
</body>
</html>
